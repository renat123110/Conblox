<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>R6 Template Cat 4-View Verification</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1c20; font-family: sans-serif; color: white; }
        #canvas { width: 1920px; height: 650px; display: block; }
        #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px 14px; border-radius: 6px; font-size: 14px; }
    </style>
    <script src="/js/vendor/three.min.js"></script>
</head>
<body>
<div id="info">Rendering R6 Template Cat (4 Views: Front, Right, Back, Left)...</div>
<canvas id="canvas" width="1920" height="650"></canvas>

<script type="module">
import { DataModel } from '/js/engine/DataModel.js';
import { Viewport } from '/js/studio/Viewport.js';
import { parseRbxm } from '/js/studio/RbxmImporter.js';
import { Vector3 } from '/js/engine/Math3D.js';

async function run() {
    const dataModel = new DataModel();
    dataModel.createDefaultPlace();

    const container = document.createElement('div');
    container.style.width = '480px';
    container.style.height = '650px';
    container.style.display = 'none';
    document.body.appendChild(container);

    const vp = new Viewport(container, dataModel);

    // Fetch and parse R6TemplateCat.rbxm
    const resp = await fetch('/R6TemplateCat.rbxm');
    const buf = await resp.arrayBuffer();
    const { roots } = parseRbxm(buf);
    const catModel = roots[0];

    // Center model around (0, 3, 0)
    const torso = catModel.FindFirstChild('Torso');
    if (torso) {
        const offset = new Vector3(0, 3, 0).sub(torso.Position);
        for (const desc of catModel.GetDescendants()) {
            if (desc.IsA && desc.IsA('BasePart')) {
                desc.Position = desc.Position.add(offset);
            }
        }
    }

    catModel.Parent = dataModel.Workspace;

    // Force Viewport to sync all parts and build meshes
    for (const desc of catModel.GetDescendants()) {
        if (desc.IsA && desc.IsA('BasePart')) {
            vp.syncPartMesh(desc);
        }
    }

    // Add bright omni lighting so all 4 sides are clearly lit
    const lights = [
        [0, 4, -8],
        [8, 4, 0],
        [0, 4, 8],
        [-8, 4, 0]
    ];
    for (const [x, y, z] of lights) {
        const l = new THREE.DirectionalLight(0xffffff, 1.1);
        l.position.set(x, y, z);
        vp.scene.add(l);
    }
    vp.scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // Wait for clothing textures and decal images to load
    await new Promise(r => setTimeout(r, 3000));

    // Rebuild meshes once textures are downloaded
    for (const desc of catModel.GetDescendants()) {
        if (desc.IsA && desc.IsA('BasePart')) {
            vp.rebuildPartMesh(desc);
            const m = vp.partMeshes.get(desc);
            if (m) vp.syncDecalOverlays(desc, m);
        }
    }

    await new Promise(r => setTimeout(r, 1000));

    const mainCanvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1920, 650);
    renderer.setPixelRatio(1);
    if (typeof THREE.SRGBColorSpace !== 'undefined') renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.autoClear = false;

    // 4 Cameras for each 90-degree angle
    // Target is torso center (0, 3.1, 0), distance 6.5
    const views = [
        { name: '1. FRONT (Cat + face.png + RED)', color: '#ff4444', pos: [0, 3.1, -6.5] },
        { name: '2. RIGHT SIDE (GREEN R)', color: '#2ecc71', pos: [6.5, 3.1, 0] },
        { name: '3. BACK (BLUE BACK)', color: '#3498db', pos: [0, 3.1, 6.5] },
        { name: '4. LEFT SIDE (YELLOW L)', color: '#f1c40f', pos: [-6.5, 3.1, 0] }
    ];

    renderer.clear();
    const w = 480, h = 650;

    for (let i = 0; i < 4; i++) {
        const v = views[i];
        const cam = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
        cam.position.set(v.pos[0], v.pos[1], v.pos[2]);
        cam.lookAt(0, 3.1, 0);

        renderer.setViewport(i * w, 0, w, h);
        renderer.setScissor(i * w, 0, w, h);
        renderer.setScissorTest(true);
        renderer.render(vp.scene, cam);
    }

    // Add 2D text overlay labels
    const overlay = document.createElement('canvas');
    overlay.width = 1920;
    overlay.height = 650;
    const ctx = overlay.getContext('2d');
    ctx.drawImage(mainCanvas, 0, 0);

    ctx.font = 'bold 20px sans-serif';
    for (let i = 0; i < 4; i++) {
        const v = views[i];
        ctx.fillStyle = v.color;
        ctx.fillText(v.name, i * w + 15, 38);

        if (i > 0) {
            ctx.strokeStyle = '#3a3a44';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(i * w, 0);
            ctx.lineTo(i * w, 650);
            ctx.stroke();
        }
    }

    const finalDataUrl = overlay.toDataURL('image/png');
    await fetch('/api/test-save-screenshot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: finalDataUrl, name: 'r6_cat_all_sides_verification.png' })
    });

    document.getElementById('info').textContent = 'ALL 4 SIDES VERIFIED & SAVED';
    console.log('R6_CAT_ALL_SIDES_COMPLETE');
}

run().catch(err => {
    console.error('Test error:', err);
    document.getElementById('info').textContent = 'Error: ' + err.message;
});
</script>
</body>
</html>
