<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Character Features Test</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #18191c; font-family: sans-serif; }
        #canvas { width: 1400px; height: 900px; display: block; }
    </style>
    <script src="/js/vendor/three.min.js"></script>
</head>
<body>
<canvas id="canvas" width="1400" height="900"></canvas>
<script type="module">
import { createBufferGeometryFromMeshData } from '/js/engine/RobloxMeshParser.js';
import { parseRbxm } from '/js/studio/RbxmImporter.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1400, 900);
renderer.setPixelRatio(1);
if (typeof THREE.SRGBColorSpace !== 'undefined') renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x23252b);

const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambLight);
const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight1.position.set(5, 8, 7);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-5, 2, -6);
scene.add(dirLight2);

// Function to project clothing UV mapping onto any arbitrary buffer geometry
function applyClothingUVMapping(geometry, limbName) {
    if (!geometry || !geometry.attributes.position) return geometry;
    const nonIndexed = geometry.index ? geometry.toNonIndexed() : geometry;
    const pos = nonIndexed.attributes.position.array;
    const norm = nonIndexed.attributes.normal?.array;
    const count = nonIndexed.attributes.position.count;
    const uvs = new Float32Array(count * 2);

    let rects = null;
    let halfX = 1, halfY = 1, halfZ = 0.5;
    if (limbName === 'Torso') {
        halfX = 1; halfY = 1; halfZ = 0.5;
        rects = {
            right:  { x: 165, y: 74,  w: 64,  h: 128 },
            left:   { x: 361, y: 74,  w: 64,  h: 128 },
            top:    { x: 231, y: 8,   w: 128, h: 64  },
            bottom: { x: 231, y: 204, w: 128, h: 64  },
            back:   { x: 427, y: 74,  w: 128, h: 128 },
            front:  { x: 231, y: 74,  w: 128, h: 128 }
        };
    } else if (limbName === 'Right Arm' || limbName === 'Right Leg') {
        halfX = 0.5; halfY = 1; halfZ = 0.5;
        rects = {
            left:   { x: 19,  y: 355, w: 64, h: 128 },
            back:   { x: 85,  y: 355, w: 64, h: 128 },
            right:  { x: 151, y: 355, w: 64, h: 128 },
            front:  { x: 217, y: 355, w: 64, h: 128 },
            top:    { x: 217, y: 289, w: 64, h: 64  },
            bottom: { x: 217, y: 485, w: 64, h: 64  }
        };
    } else if (limbName === 'Left Arm' || limbName === 'Left Leg') {
        halfX = 0.5; halfY = 1; halfZ = 0.5;
        rects = {
            front:  { x: 307, y: 355, w: 64, h: 128 },
            left:   { x: 373, y: 355, w: 64, h: 128 },
            back:   { x: 439, y: 355, w: 64, h: 128 },
            right:  { x: 505, y: 355, w: 64, h: 128 },
            top:    { x: 307, y: 289, w: 64, h: 64  },
            bottom: { x: 307, y: 485, w: 64, h: 64  }
        };
    }

    if (!rects) return nonIndexed;

    const W = 585, H = 559;
    for (let i = 0; i < count; i++) {
        const px = pos[i * 3];
        const py = pos[i * 3 + 1];
        const pz = pos[i * 3 + 2];
        const nx = norm ? norm[i * 3] : 0;
        const ny = norm ? norm[i * 3 + 1] : 0;
        const nz = norm ? norm[i * 3 + 2] : 1;

        const nxa = Math.abs(nx);
        const nya = Math.abs(ny);
        const nza = Math.abs(nz);

        let r = rects.front;
        let fu = 0.5;
        let fv = 0.5;

        if (nza >= nxa && nza >= nya) {
            // Front face is +Z in Roblox character coordinates
            if (nz >= 0) {
                r = rects.front;
                fu = (px / halfX + 1.0) * 0.5;
                fv = (1.0 - py / halfY) * 0.5;
            } else {
                // Back face is -Z in Roblox character coordinates
                r = rects.back;
                fu = (1.0 - px / halfX) * 0.5;
                fv = (1.0 - py / halfY) * 0.5;
            }
        } else if (nxa >= nya) {
            if (nx >= 0) {
                // Right face (+X)
                r = rects.right;
                fu = (pz / halfZ + 1.0) * 0.5;
                fv = (1.0 - py / halfY) * 0.5;
            } else {
                // Left face (-X)
                r = rects.left;
                fu = (1.0 - pz / halfZ) * 0.5;
                fv = (1.0 - py / halfY) * 0.5;
            }
        } else {
            if (ny >= 0) {
                // Top face (+Y)
                r = rects.top;
                fu = (1.0 - px / halfX) * 0.5;
                fv = (1.0 - pz / halfZ) * 0.5;
            } else {
                // Bottom face (-Y)
                r = rects.bottom;
                fu = (1.0 - px / halfX) * 0.5;
                fv = (pz / halfZ + 1.0) * 0.5;
            }
        }

        fu = Math.max(0, Math.min(1, fu));
        fv = Math.max(0, Math.min(1, fv));

        const u = (r.x + fu * r.w) / W;
        const v = 1.0 - ((r.y + fv * r.h) / H);
        uvs[i * 2] = u;
        uvs[i * 2 + 1] = v;
    }

    nonIndexed.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    nonIndexed.attributes.uv.needsUpdate = true;
    return nonIndexed;
}

// Function to create clothing-mapped BoxGeometry for R6 limbs
function createClothingBoxGeometry(partName, sx, sy, sz) {
    const geo = new THREE.BoxGeometry(sx, sy, sz);
    const uvs = geo.attributes.uv.array;
    let rects = null;
    if (partName === 'Torso') {
        rects = {
            right:  { x: 165, y: 74,  w: 64,  h: 128 },
            left:   { x: 361, y: 74,  w: 64,  h: 128 },
            top:    { x: 231, y: 8,   w: 128, h: 64  },
            bottom: { x: 231, y: 204, w: 128, h: 64  },
            back:   { x: 427, y: 74,  w: 128, h: 128 },
            front:  { x: 231, y: 74,  w: 128, h: 128 }
        };
    } else if (partName === 'Right Arm' || partName === 'Right Leg') {
        rects = {
            left:   { x: 19,  y: 355, w: 64, h: 128 },
            back:   { x: 85,  y: 355, w: 64, h: 128 },
            right:  { x: 151, y: 355, w: 64, h: 128 },
            front:  { x: 217, y: 355, w: 64, h: 128 },
            top:    { x: 217, y: 289, w: 64, h: 64  },
            bottom: { x: 217, y: 485, w: 64, h: 64  }
        };
    } else if (partName === 'Left Arm' || partName === 'Left Leg') {
        rects = {
            front:  { x: 307, y: 355, w: 64, h: 128 },
            left:   { x: 373, y: 355, w: 64, h: 128 },
            back:   { x: 439, y: 355, w: 64, h: 128 },
            right:  { x: 505, y: 355, w: 64, h: 128 },
            top:    { x: 307, y: 289, w: 64, h: 64  },
            bottom: { x: 307, y: 485, w: 64, h: 64  }
        };
    }
    if (rects) {
        const W = 585, H = 559;
        const faceOrder = [rects.right, rects.left, rects.top, rects.bottom, rects.front, rects.back];
        for (let f = 0; f < 6; f++) {
            const r = faceOrder[f];
            const u0 = r.x / W, u1 = (r.x + r.w) / W;
            const v1 = 1.0 - (r.y / H), v0 = 1.0 - ((r.y + r.h) / H);
            const off = f * 8;
            uvs[off + 0] = u0; uvs[off + 1] = v1;
            uvs[off + 2] = u1; uvs[off + 3] = v1;
            uvs[off + 4] = u0; uvs[off + 5] = v0;
            uvs[off + 6] = u1; uvs[off + 7] = v0;
        }
        geo.attributes.uv.needsUpdate = true;
    }
    return geo;
}

// 1. Load CuteRobot.rbxm
const cuteResp = await fetch('/CuteRobot.rbxm');
const cuteBuf = await cuteResp.arrayBuffer();
const { roots: cuteRoots } = parseRbxm(new Uint8Array(cuteBuf));
const cuteModel = cuteRoots[0];

// 2. Load Woman Torso mesh (MeshId 48112070)
const meshResp = await fetch('/api/roblox-mesh?id=48112070');
const meshJson = await meshResp.json();
const womanTorsoGeo = createBufferGeometryFromMeshData(meshJson.geometry);

// 3. Load Clothing textures: Shirt (97314641273710) and Pants (89031082253597)
const loadImage = (url) => new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.src = url;
});
const [shirtImg, pantsImg] = await Promise.all([
    loadImage('/api/roblox-asset?id=97314641273710'),
    loadImage('/api/roblox-asset?id=89031082253597')
]);

// 4. Create composite clothing canvas
const composeCanvas = (includeShirt, includePants, skinHex = '#e6c8b4') => {
    const c = document.createElement('canvas');
    c.width = 585; c.height = 559;
    const ctx = c.getContext('2d');
    ctx.fillStyle = skinHex;
    ctx.fillRect(0, 0, 585, 559);
    if (includePants && pantsImg) ctx.drawImage(pantsImg, 0, 0, 585, 559);
    if (includeShirt && shirtImg) ctx.drawImage(shirtImg, 0, 0, 585, 559);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
};

const torsoTex = composeCanvas(true, true);
const shirtTex = composeCanvas(true, false);
const pantsTex = composeCanvas(false, true);

// 5. Build Three.js hierarchy for CuteRobot
const robotGroup = new THREE.Group();

for (const desc of cuteModel.GetDescendants()) {
    if (!desc.IsA || !desc.IsA('BasePart')) continue;
    if (desc.Name === 'HumanoidRootPart' || Number(desc.Transparency) >= 1) continue;
    const s = desc.Size || { x: 1, y: 1, z: 1 };
    let geo = null;
    let mat = null;

    if (desc.Name === 'Torso') {
        // CharacterMesh replacement for Torso with projective clothing mapping!
        geo = applyClothingUVMapping(womanTorsoGeo.clone(), 'Torso');
        geo.scale(s.x / 2, s.y / 2, s.z / 1);
        mat = new THREE.MeshStandardMaterial({ map: torsoTex, roughness: 0.4, metalness: 0.05 });
    } else if (desc.Name === 'Left Arm' || desc.Name === 'Right Arm') {
        geo = createClothingBoxGeometry(desc.Name, s.x, s.y, s.z);
        mat = new THREE.MeshStandardMaterial({ map: shirtTex, roughness: 0.4, metalness: 0.05 });
    } else if (desc.Name === 'Left Leg' || desc.Name === 'Right Leg') {
        geo = createClothingBoxGeometry(desc.Name, s.x, s.y, s.z);
        mat = new THREE.MeshStandardMaterial({ map: pantsTex, roughness: 0.4, metalness: 0.05 });
    } else if (desc.Name === 'Head') {
        geo = new THREE.BoxGeometry(s.x, s.y, s.z);
        mat = new THREE.MeshStandardMaterial({ color: 0xe6c8b4, roughness: 0.5 });
    } else if (desc.FindFirstChildOfClass && desc.FindFirstChildOfClass('SpecialMesh')) {
        const sm = desc.FindFirstChildOfClass('SpecialMesh');
        const aid = (sm.MeshId || '').match(/\d+/)?.[0];
        const tid = (sm.TextureId || '').match(/\d+/)?.[0];
        if (aid) {
            try {
                const mData = await (await fetch(`/api/roblox-mesh?id=${aid}`)).json();
                if (mData.geometry) {
                    geo = createBufferGeometryFromMeshData(mData.geometry);
                    const sc = sm.Scale || { x: 1, y: 1, z: 1 };
                    geo.scale(sc.x, sc.y, sc.z);
                    if (tid) {
                        const tImg = await loadImage(`/api/roblox-asset?id=${tid}`);
                        const tTex = new THREE.CanvasTexture(tImg);
                        tTex.colorSpace = THREE.SRGBColorSpace;
                        mat = new THREE.MeshStandardMaterial({ map: tTex, roughness: 0.4 });
                    } else {
                        mat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.4 });
                    }
                }
            } catch (_) {}
        }
    }

    if (geo && mat) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(desc.Position.x, desc.Position.y, desc.Position.z);
        robotGroup.add(m);
    }
}
scene.add(robotGroup);

// Center CuteRobot
const robotBox = new THREE.Box3().setFromObject(robotGroup);
const robotCenter = new THREE.Vector3();
robotBox.getCenter(robotCenter);
for (const child of robotGroup.children) {
    child.position.sub(robotCenter);
}

// Front view on the left
robotGroup.position.set(-3.2, 0, 0);
robotGroup.rotation.y = 0;

// Back view in the middle (clone)
const robotBack = robotGroup.clone(true);
robotBack.position.set(0, 0, 0);
robotBack.rotation.y = Math.PI;
scene.add(robotBack);

window.__robotGroup = robotGroup;
window.__torsoTex = torsoTex;

// 6. Build StarterCharacter with WomanBody (Torso CharacterMesh)
const starterResp = await fetch('/StarterCharacter.rbxm');
const starterBuf = await starterResp.arrayBuffer();
const { roots: starterRoots } = parseRbxm(new Uint8Array(starterBuf));
const starterModel = starterRoots[0];

const starterGroup = new THREE.Group();
for (const desc of starterModel.GetDescendants()) {
    if (!desc.IsA || !desc.IsA('BasePart')) continue;
    if (desc.Name === 'HumanoidRootPart' || Number(desc.Transparency) >= 1) continue;
    const s = desc.Size || { x: 1, y: 1, z: 1 };
    let geo = null;
    let mat = null;

    if (desc.Name === 'Torso') {
        // WomanBody CharacterMesh applied!
        geo = womanTorsoGeo.clone();
        geo.scale(s.x / 2, s.y / 2, s.z / 1);
        mat = new THREE.MeshStandardMaterial({ color: 0x00a2ff, roughness: 0.5 });
    } else {
        geo = new THREE.BoxGeometry(s.x, s.y, s.z);
        const col = desc.Color || { r: 0.6, g: 0.6, b: 0.6 };
        mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(col.r ?? 0.6, col.g ?? 0.6, col.b ?? 0.6),
            roughness: 0.5
        });
    }

    const m = new THREE.Mesh(geo, mat);
    m.position.set(desc.Position.x, desc.Position.y, desc.Position.z);
    starterGroup.add(m);
}
const starterBox = new THREE.Box3().setFromObject(starterGroup);
const starterCenter = new THREE.Vector3();
starterBox.getCenter(starterCenter);
for (const child of starterGroup.children) {
    child.position.sub(starterCenter);
}
starterGroup.position.set(3.2, 0, 0);
starterGroup.rotation.y = 0;
scene.add(starterGroup);

// Camera framing both characters
const camera = new THREE.PerspectiveCamera(40, 1400 / 900, 0.1, 100);
camera.position.set(0, 0.4, 11.5);
camera.lookAt(0, 0, 0);

renderer.render(scene, camera);

// Save screenshot to server
const dataUrl = canvas.toDataURL('image/png');
await fetch('/api/test-save-screenshot', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: dataUrl, name: 'character_features_verification.png' })
});

console.log('ALL_FEATURES_VERIFIED_SUCCESSFULLY');
</script>
</body>
</html>
