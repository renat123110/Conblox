<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WomanBody Clothing Test</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; }
        canvas { display: block; margin: 20px auto; border: 1px solid #444; }
    </style>
    <script src="/js/vendor/three.min.js"></script>
</head>
<body>
    <h2 style="text-align:center;">WomanBody Torso with Shirt</h2>
    <canvas id="c" width="1000" height="500"></canvas>
    <script type="module">
        import { createBufferGeometryFromMeshData } from '/js/engine/RobloxMeshParser.js';

        async function init() {
            const meshRes = await fetch('/api/roblox-mesh?id=48112070');
            const meshJson = await meshRes.json();
            const geomData = meshJson.geometry;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333338);

            const cam = new THREE.PerspectiveCamera(40, 1000/500, 0.1, 100);
            cam.position.set(0, 0, -5);
            cam.lookAt(0, 0, 0);

            const l1 = new THREE.DirectionalLight(0xffffff, 1.2);
            l1.position.set(2, 3, 4);
            scene.add(l1);
            const l2 = new THREE.DirectionalLight(0xffffff, 0.8);
            l2.position.set(-2, 1, -4);
            scene.add(l2);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Load shirt texture from R6TemplateCat or a test shirt
            // Let's create a test pattern on 585x559 canvas with clear labels
            const cv = document.createElement('canvas');
            cv.width = 585; cv.height = 559;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = '#ffccaa'; // skin
            ctx.fillRect(0,0,585,559);

            // Draw Torso rects in green/blue with labels
            // Torso front: x: 231, y: 74, w: 128, h: 128
            ctx.fillStyle = '#ff2222';
            ctx.fillRect(231, 74, 128, 128);
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px bold sans-serif';
            ctx.fillText('FRONT', 250, 140);

            // Torso back: x: 427, y: 74, w: 128, h: 128
            ctx.fillStyle = '#2222ff';
            ctx.fillRect(427, 74, 128, 128);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('BACK', 450, 140);

            // Torso right: x: 165, y: 74, w: 64, h: 128
            ctx.fillStyle = '#22aa22';
            ctx.fillRect(165, 74, 64, 128);
            ctx.fillText('R', 185, 140);

            // Torso left: x: 361, y: 74, w: 64, h: 128
            ctx.fillStyle = '#aaaa22';
            ctx.fillRect(361, 74, 64, 128);
            ctx.fillText('L', 380, 140);

            const tex = new THREE.CanvasTexture(cv);
            tex.colorSpace = THREE.SRGBColorSpace;

            // Mesh 1: Original UVs (Left)
            const geo1 = createBufferGeometryFromMeshData(geomData);
            const mat1 = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 });
            const m1 = new THREE.Mesh(geo1, mat1);
            m1.position.set(-1.3, 0, 0);
            scene.add(m1);

            // Mesh 2: applyClothingUVMappingToGeometry (Right)
            // Let's import Viewport logic
            import('/js/studio/Viewport.js').then(vpMod => {
                const vpProto = vpMod.Viewport.prototype;
                const geo2 = vpProto.applyClothingUVMappingToGeometry(createBufferGeometryFromMeshData(geomData), 'Torso');
                const m2 = new THREE.Mesh(geo2, mat1);
                m2.position.set(1.3, 0, 0);
                scene.add(m2);

                const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
                renderer.setSize(1000, 500);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.render(scene, cam);
                window.__RENDER_DONE = true;
            });
        }
        init();
    </script>
</body>
</html>
